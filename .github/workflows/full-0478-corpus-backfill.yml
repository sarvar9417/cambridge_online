name: Audit and import 0478 Paper 2

# Deliberately manual: changing code or merging a PR must never stage PDFs or
# import into the shared production database.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Audit (read-only) or explicitly approved database import'
        type: choice
        options: [audit, apply]
        default: audit
        required: true
      confirm:
        description: 'For apply only: enter I_APPROVE_0478_PAPER2_DB_WRITES'
        required: false
        type: string
      limit:
        description: 'Maximum un-ingested Paper 2 variants to apply (0 = all)'
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: 0478-paper2-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CORPUS_RUNNER_URL: https://mphmganorvhsnwvhcxyj.supabase.co/functions/v1/corpus-runner
      BACKFILL_MODE: ${{ inputs.mode || 'audit' }}
      BACKFILL_COMPONENTS: '2'
      BACKFILL_CONFIRM: ${{ inputs.confirm || '' }}
      BACKFILL_LIMIT: ${{ inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require explicit approval and main ref before database writes
        if: ${{ inputs.mode == 'apply' }}
        env:
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Database writes must run on main after separate production approval.'
            exit 1
          fi
          if [ "$INPUT_CONFIRM" != 'I_APPROVE_0478_PAPER2_DB_WRITES' ]; then
            echo 'Explicit confirmation missing. No changes made.'
            exit 1
          fi
      - name: Install corpus tools
        run: python -m pip install --upgrade 'gdown==5.2.0' requests scikit-learn
      - name: Syntax and scope tests
        run: |
          python -m py_compile backend/scripts/full-0478-corpus-backfill.py
          python -m unittest discover -s backend/scripts -p 'test_0478_paper2_audit.py' -v
      - name: Run scoped 0478 Paper 2 workflow
        id: backfill
        shell: bash
        run: |
          set +e
          python backend/scripts/full-0478-corpus-backfill.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0478-paper2-audit-report
          path: 0478-backfill-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce result
        if: always()
        run: |
          code='${{ steps.backfill.outputs.exit_code }}'
          if [ -z "$code" ]; then code=1; fi
          exit "$code"
