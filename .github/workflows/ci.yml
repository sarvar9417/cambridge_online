name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify
      - name: Ensure private environment is not tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ev '(^|/)\.env\.example$' | grep -Eq '(^|/)\.env($|\.)'; then
            echo 'A private .env file is tracked by Git.' >&2
            exit 1
          fi
          if git grep -nE 'sbp_[A-Za-z0-9_-]{20,}|sb_publishable_[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}' -- ':!*.example' ':!*.example.*'; then
            echo 'A Supabase credential-like token is present in a tracked file.' >&2
            exit 1
          fi
