name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify
      - name: Ensure private environment is not tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ev '(^|/)\.env\.example$' | grep -Eq '(^|/)\.env($|\.)'; then
            echo 'A private .env file is tracked by Git.' >&2
            exit 1
          fi
          if git grep -nE 'sbp_[A-Za-z0-9_-]{20,}|sb_publishable_[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}' -- ':!*.example' ':!*.example.*'; then
            echo 'A Supabase credential-like token is present in a tracked file.' >&2
            exit 1
          fi

  live-real-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campath
      DB_SSL_MODE: disable
      SEED_OWNER_EMAIL: acceptance-owner@example.test
      SEED_OWNER_USERNAME: acceptance-owner
      SEED_OWNER_PASSWORD: acceptance-owner-password
      SEED_STUDENT_PASSWORD: acceptance-student-password
      LIVE_DB_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bootstrap Supabase API roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN;
            END IF;
          END
          $do$;
          CREATE OR REPLACE FUNCTION public.rls_auto_enable()
          RETURNS event_trigger
          LANGUAGE plpgsql
          AS $fn$
          BEGIN
            NULL;
          END;
          $fn$;
          SQL
      - name: Apply every repository migration on clean PostgreSQL
        run: npm run db:migrate -w backend
      - name: Seed deterministic acceptance fixtures
        run: npm run db:seed -w backend
      - name: Run Live Challenge real-database acceptance
        run: npm run test:live-db -w backend

