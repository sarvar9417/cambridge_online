name: Refresh LaTeX lockfile

on:
  push:
    branches:
      - feat/latex-corpus-foundation

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/latex-corpus-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(latex): refresh npm lockfile"
          git push origin HEAD:feat/latex-corpus-foundation
