name: Materialize Chapter 5 real deck assets

on:
  push:
    branches:
      - feature/ch5-real-pptx-project-mirror-20260921
    paths:
      - .github/workflows/materialize-ch5-real-deck.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ch5-real-pptx-project-mirror-20260921
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download approved Drive PPTX
        env:
          SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-be88-81f4-a9c9-5fc032177d5b/raw?se=2026-09-21T06%3A54%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=3b8834f2-27fa-5edd-9025-a9e231bd96b5&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T03%3A45%3A16Z&ske=2026-09-22T03%3A45%3A16Z&sks=b&skv=2026-02-06&sig=9hYZDkDi5gBSlAM5GwjUy7C3WecZ/3vTBiQhByJO1OI%3D'
        run: |
          mkdir -p /tmp/ch5
          curl --fail --location --retry 3 --output /tmp/ch5/source.pptx "$SOURCE_URL"
          test "$(stat -c%s /tmp/ch5/source.pptx)" -gt 1900000
      - name: Build project slide assets and mirror
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          from PIL import Image
          import io, json, shutil

          source=Path('/tmp/ch5/source.pptx')
          root=Path('frontend/public/9618/presentations/chapter-05')
          slides=root/'slides'
          slides.mkdir(parents=True,exist_ok=True)
          NS={'r':'http://schemas.openxmlformats.org/package/2006/relationships'}
          with ZipFile(source) as z:
              for n in range(1,25):
                  rel=ET.fromstring(z.read(f'ppt/slides/_rels/slide{n}.xml.rels'))
                  targets=[node.attrib['Target'] for node in rel.findall('r:Relationship',NS) if node.attrib.get('Type','').endswith('/image')]
                  if not targets:
                      raise RuntimeError(f'No image on slide {n}')
                  data=z.read('ppt/'+targets[0].replace('../',''))
                  im=Image.open(io.BytesIO(data)).convert('RGB').resize((1024,576),Image.Resampling.LANCZOS)
                  im.save(slides/f'slide-{n:02d}.jpg','JPEG',quality=70,optimize=True,progressive=True)
          mirror=root/'9618_Chapter_05_System_Software_Project_Mirror.pptx'
          shutil.copy2(source,mirror)
          titles=[
            '5 System Software','Operating system: the essential bridge','Start-up: from BIOS to OS in RAM','GUI, CLI and post-WIMP interfaces','Memory management','Security management','Process, hardware and file management','Printer management scenario','Utility software overview','Disk formatter and bad sectors','Antivirus workflow','Defragmentation: before and after','Disk analysis, compression and backup','Program libraries','Static libraries and DLL files','Language translators: precise meanings','Assembler and loader','Compiler vs interpreter','Partial compilation and bytecode','IDE overview','Source-code editor features','Debugger workflow','2026 exam focus: system software','Chapter 5 complete review']
          manifest={
            'id':'9618-chapter-05-system-software','course':'9618','chapter':5,'title':'System Software','delivery':'project-slide-images',
            'sourcePptx':{'fileName':'9618_Chapter_05_System_Software_Real_Deck.pptx','driveFileId':'1rfHQbyArf0CnPfMrAJ0hezWflWY__i5k','driveUrl':'https://docs.google.com/presentation/d/1rfHQbyArf0CnPfMrAJ0hezWflWY__i5k/edit?usp=drivesdk&ouid=111028846541723094078&rtpof=true&sd=true','shared':True},
            'projectMirror':{'pptx':'/9618/presentations/chapter-05/9618_Chapter_05_System_Software_Project_Mirror.pptx','compressed':False,'note':'Drive-approved image-based PPTX copied into the project because the source deck is already compact.'},
            'slideCount':24,'slideFormat':'jpg','slideBasePath':'/9618/presentations/chapter-05/slides',
            'slides':[{'number':n,'title':titles[n-1],'image':f'/9618/presentations/chapter-05/slides/slide-{n:02d}.jpg'} for n in range(1,25)],
            'sourceRange':'Hodder 9618 Chapter 5, printed pp.136–158',
            'topics':['5.1 Operating systems','5.2 Language translators'],
            'examEvidence':['Cambridge 2026 system-software mark-scheme habits: exact role, example, trade-off and scenario matching'],
            'runtime':{'htmlCssReconstruction':False,'sourceOfTruth':'Drive PPTX','projectDelivery':'static slide images + PPTX mirror'}
          }
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print('slides',len(list(slides.glob('*.jpg'))),'mirror_bytes',mirror.stat().st_size)
          PY
      - name: Commit generated assets and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/9618/presentations/chapter-05
          git rm .github/workflows/materialize-ch5-real-deck.yml
          git commit -m "Store Chapter 5 real deck mirror and slide assets in project"
          git push origin HEAD:feature/ch5-real-pptx-project-mirror-20260921
