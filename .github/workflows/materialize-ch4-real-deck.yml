name: Materialize Chapter 4 real deck assets

on:
  push:
    branches:
      - feature/ch4-real-pptx-project-mirror-20260921
    paths:
      - .github/workflows/materialize-ch4-real-deck.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ch4-real-pptx-project-mirror-20260921
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download approved Drive PPTX
        env:
          SOURCE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-f534-8210-b8c3-67194c347347/raw?se=2026-09-21T06%3A37%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=05dfeffd-a1e3-5b94-8f36-7becd05d7a04&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T05%3A05%3A00Z&ske=2026-09-22T05%3A05%3A00Z&sks=b&skv=2026-02-06&sig=VwTVeF5GH0PDw%2B/yoOjXUU/2vebcQiS3PLNgULa75T8%3D'
        run: |
          mkdir -p /tmp/ch4
          curl --fail --location --retry 3 --output /tmp/ch4/source.pptx "$SOURCE_URL"
          test "$(stat -c%s /tmp/ch4/source.pptx)" -gt 2000000
      - name: Build project slide assets and mirror
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          from PIL import Image
          import io, json, shutil

          source=Path('/tmp/ch4/source.pptx')
          root=Path('frontend/public/9618/presentations/chapter-04')
          slides=root/'slides'
          slides.mkdir(parents=True,exist_ok=True)

          NS={'r':'http://schemas.openxmlformats.org/package/2006/relationships'}
          for n in range(1,30):
              with ZipFile(source) as z:
                  rel_path=f'ppt/slides/_rels/slide{n}.xml.rels'
                  rel=ET.fromstring(z.read(rel_path))
                  targets=[]
                  for node in rel.findall('r:Relationship',NS):
                      if node.attrib.get('Type','').endswith('/image'):
                          targets.append(node.attrib['Target'])
                  if not targets:
                      raise RuntimeError(f'No image on slide {n}')
                  media='ppt/'+targets[0].replace('../','')
                  data=z.read(media)
              im=Image.open(io.BytesIO(data)).convert('RGB')
              im=im.resize((1024,576),Image.Resampling.LANCZOS)
              out=slides/f'slide-{n:02d}.jpg'
              im.save(out,'JPEG',quality=68,optimize=True,progressive=True)

          mirror=root/'9618_Chapter_04_Processor_Fundamentals_Project_Mirror.pptx'
          shutil.copy2(source,mirror)

          titles=[
            '4 Processor Fundamentals',
            'Von Neumann architecture and the stored program concept',
            'CPU components: ALU, CU, clock and IAS',
            'Registers: PC, MAR, MDR, CIR, ACC, IX and status register',
            'Status register flags: C, N, V and Z',
            'System buses: address, data and control',
            'Processor performance factors',
            'Cache memory and multi-core processors',
            'Ports: USB, HDMI and VGA',
            'USB: serial transfer and plug-and-play',
            'HDMI compared with VGA',
            'Fetch-execute cycle overview',
            'Fetch stage in Register Transfer Notation',
            'Decode and execute stages',
            'Interrupt handling and the ISR',
            '4.2 Assembly Language',
            'Assembly language and machine code',
            'Two-pass assembler',
            'Assembly instruction groups',
            'Addressing modes',
            'Worked assembly trace',
            'Indexed addressing and loops',
            '4.3 Bit Manipulation',
            'Logical, arithmetic and cyclic shifts',
            'Logical shift instructions: LSL and LSR',
            'Bit masks with AND, OR and XOR',
            'Monitoring and control with a sensor bit',
            '2026 exam focus and mark-scheme habits',
            'Chapter 4 complete review and exam practice',
          ]
          manifest={
            'id':'9618-chapter-04-processor-fundamentals',
            'course':'9618',
            'chapter':4,
            'title':'Processor Fundamentals',
            'delivery':'project-slide-images',
            'sourcePptx':{
              'fileName':'9618_Chapter_04_Processor_Fundamentals_Real_Deck.pptx',
              'driveFileId':'19BNaVlBMDda967NYqRUIyAjAEkF6elYI',
              'driveUrl':'https://docs.google.com/presentation/d/19BNaVlBMDda967NYqRUIyAjAEkF6elYI/edit?usp=drivesdk&ouid=111028846541723094078&rtpof=true&sd=true',
              'shared':True,
            },
            'projectMirror':{
              'pptx':'/9618/presentations/chapter-04/9618_Chapter_04_Processor_Fundamentals_Project_Mirror.pptx',
              'compressed':False,
              'note':'Drive-approved image-based PPTX copied into the project because the source deck is already compact.',
            },
            'slideCount':29,
            'slideFormat':'jpg',
            'slideBasePath':'/9618/presentations/chapter-04/slides',
            'slides':[{
              'number':n,
              'title':titles[n-1],
              'image':f'/9618/presentations/chapter-04/slides/slide-{n:02d}.jpg'
            } for n in range(1,30)],
            'sourceRange':'Hodder 9618 Chapter 4, printed pp.107–135',
            'topics':[
              '4.1 Central Processing Unit (CPU) Architecture',
              '4.2 Assembly Language',
              '4.3 Bit Manipulation',
            ],
            'examEvidence':[
              '9618/11/M/J/26 Q3(a–c)',
              '9618/13/M/J/26 Q7(a–c)',
            ],
            'runtime':{
              'htmlCssReconstruction':False,
              'sourceOfTruth':'Drive PPTX',
              'projectDelivery':'static slide images + PPTX mirror',
            }
          }
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print('slides',len(list(slides.glob('*.jpg'))),'mirror_bytes',mirror.stat().st_size)
          PY
      - name: Commit generated assets and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/9618/presentations/chapter-04
          git rm .github/workflows/materialize-ch4-real-deck.yml
          git commit -m "Store Chapter 4 real deck mirror and slide assets in project"
          git push origin HEAD:feature/ch4-real-pptx-project-mirror-20260921
