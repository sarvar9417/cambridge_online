name: 9618 export E2E smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/src/jobs/export-e2e-smoke-cli.ts
      - backend/src/lib/export-html.ts
      - backend/src/lib/export-assets.ts
      - backend/src/lib/export-docx.ts
      - backend/src/repositories/questions-repository.ts
      - backend/src/repositories/staff-aware-questions-repository.ts
      - .github/workflows/export-e2e-smoke.yml

jobs:
  export-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_STORAGE_SECRET_KEY: ${{ secrets.SUPABASE_STORAGE_SECRET_KEY }}
      DB_SSL_MODE: ${{ secrets.DB_SSL_MODE }}
      DB_SSL_CA_BASE64: ${{ secrets.DB_SSL_CA_BASE64 }}
      ASSET_STORAGE_BUCKET: question-assets
      PDFTOTEXT_PATH: /usr/bin/pdftotext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check required secret presence
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in DATABASE_URL SUPABASE_URL SUPABASE_STORAGE_SECRET_KEY; do
            if [ -n "${!key:-}" ]; then
              echo "$key=present"
            else
              echo "$key=missing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Export E2E secrets are incomplete."
            exit 2
          fi
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install dependencies
        run: npm ci
      - name: Run production-backed export smoke
        working-directory: backend
        env:
          CHROME_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npx tsx src/jobs/export-e2e-smoke-cli.ts
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 9618-export-e2e-${{ github.sha }}
          path: backend/tmp/export-e2e
          if-no-files-found: warn
          retention-days: 7
