name: 9618 export E2E smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/src/jobs/export-e2e-smoke-cli.ts
      - backend/src/jobs/processors/export-pdf.ts
      - backend/src/lib/assignment-export.ts
      - backend/src/lib/export-html.ts
      - backend/src/lib/export-html.fidelity.test.ts
      - backend/src/lib/question-bank-export-milestone.test.ts
      - backend/src/lib/export-assets.ts
      - backend/src/lib/export-docx.ts
      - backend/src/repositories/questions-repository.ts
      - backend/src/repositories/staff-aware-questions-repository.ts
      - .github/workflows/export-e2e-smoke.yml

jobs:
  export-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_STORAGE_SECRET_KEY: ${{ secrets.SUPABASE_STORAGE_SECRET_KEY }}
      DB_SSL_MODE: ${{ secrets.DB_SSL_MODE }}
      DB_SSL_CA_BASE64: ${{ secrets.DB_SSL_CA_BASE64 }}
      ASSET_STORAGE_BUCKET: question-assets
      PDFTOTEXT_PATH: /usr/bin/pdftotext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck backend export pipeline
        run: npm run typecheck -w backend
      - name: Run export fidelity unit tests
        run: npm run test -w backend -- --run src/lib/export-html.test.ts src/lib/export-html.fidelity.test.ts src/lib/question-bank-export-milestone.test.ts
      - name: Detect production smoke credentials
        id: smoke-secrets
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for key in DATABASE_URL SUPABASE_URL SUPABASE_STORAGE_SECRET_KEY; do
            if [ -n "${!key:-}" ]; then
              echo "$key=present"
            else
              echo "$key=missing"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Production smoke unavailable
        if: steps.smoke-secrets.outputs.ready != 'true'
        run: echo "Production-backed PDF rendering is skipped because repository Actions secrets are not configured. Offline typecheck and fidelity tests still ran."
      - name: Install PDF inspection tools
        if: steps.smoke-secrets.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install Chrome
        if: steps.smoke-secrets.outputs.ready == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Run production-backed export smoke
        if: steps.smoke-secrets.outputs.ready == 'true'
        working-directory: backend
        env:
          NODE_ENV: production
          CHROME_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npx tsx src/jobs/export-e2e-smoke-cli.ts
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 9618-export-e2e-${{ github.sha }}
          path: backend/tmp/export-e2e
          if-no-files-found: warn
          retention-days: 7
