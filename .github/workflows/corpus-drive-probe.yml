name: Corpus Drive probe

on:
  push:
    branches: [agent/hodder-knowledge-map]
    paths: [.github/workflows/corpus-drive-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download representative legacy PDF
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl -fL --max-time 20 --connect-timeout 10 \
            -A 'CamPathCorpusProbe/1.0' \
            'https://drive.usercontent.google.com/download?id=1p-4UAx8eUHrupoc2ySeiXJNXnyIuFLMJ&export=download&confirm=t' \
            -o /tmp/probe.pdf
          test "$(stat -c%s /tmp/probe.pdf)" -gt 1000
          pdfinfo /tmp/probe.pdf | grep -E 'Pages|Page size'
          pdftotext -layout /tmp/probe.pdf /tmp/probe.txt
          test "$(wc -c </tmp/probe.txt)" -gt 1000
          echo DRIVE_PROBE_OK
