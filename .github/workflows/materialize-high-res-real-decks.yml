name: Materialize high-resolution real deck assets

on:
  push:
    branches:
      - feature/high-res-real-deck-slides-20260921
    paths:
      - .github/workflows/materialize-high-res-real-decks.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/high-res-real-deck-slides-20260921
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download Drive source PPTX files
        env:
          CH3_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ade0-8210-a51f-40ec214e855f/raw?se=2026-09-21T07%3A09%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=aa611761-da1a-51ce-987c-683ee7925ffa&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T06%3A38%3A02Z&ske=2026-09-22T06%3A38%3A02Z&sks=b&skv=2026-02-06&sig=ZeVWWGEdAyqHBqPAuO22%2BOBx78IgFruHzIo8JRmrxkw%3D'
          CH4_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-f6f4-8210-9b52-564fd8b9b971/raw?se=2026-09-21T07%3A09%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=6170b681-fb03-5923-a956-45b9a61c1b2d&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T07%3A03%3A47Z&ske=2026-09-22T07%3A03%3A47Z&sks=b&skv=2026-02-06&sig=iS/vLCiFeKa9UDC1jc4dM4ykz0yuaLDtFJyTH2wmpvI%3D'
          CH5_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-51f0-81f4-ae4c-192aa9366e93/raw?se=2026-09-21T07%3A09%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=b7dad46d-12b1-5a22-b464-46324c06db79&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T18%3A11%3A22Z&ske=2026-09-21T18%3A11%3A22Z&sks=b&skv=2026-02-06&sig=FzvQyv3nJ6w4rWXWlGfn9h6jVMzik3OKumDwUuRTm/4%3D'
        run: |
          mkdir -p /tmp/real-decks
          curl --fail --location --retry 3 --output /tmp/real-decks/chapter-03.pptx "$CH3_URL"
          curl --fail --location --retry 3 --output /tmp/real-decks/chapter-04.pptx "$CH4_URL"
          curl --fail --location --retry 3 --output /tmp/real-decks/chapter-05.pptx "$CH5_URL"
          test "$(stat -c%s /tmp/real-decks/chapter-03.pptx)" -gt 30000000
          test "$(stat -c%s /tmp/real-decks/chapter-04.pptx)" -gt 2000000
          test "$(stat -c%s /tmp/real-decks/chapter-05.pptx)" -gt 1500000
      - name: Export 2560x1440 WebP slides
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          from PIL import Image
          import io, json

          WIDTH, HEIGHT = 2560, 1440
          NS={'r':'http://schemas.openxmlformats.org/package/2006/relationships'}
          configs=[
            ('03',22,'/tmp/real-decks/chapter-03.pptx'),
            ('04',29,'/tmp/real-decks/chapter-04.pptx'),
            ('05',24,'/tmp/real-decks/chapter-05.pptx'),
          ]

          def first_image(z, n):
            rel=ET.fromstring(z.read(f'ppt/slides/_rels/slide{n}.xml.rels'))
            for node in rel.findall('r:Relationship',NS):
              if node.attrib.get('Type','').endswith('/image'):
                return 'ppt/'+node.attrib['Target'].replace('../','')
            raise RuntimeError(f'No image on slide {n}')

          for chapter, count, pptx in configs:
            root=Path(f'frontend/public/9618/presentations/chapter-{chapter}')
            slides=root/'slides'
            for existing in slides.glob('*'):
              existing.unlink()
            slides.mkdir(parents=True, exist_ok=True)
            with ZipFile(pptx) as z:
              for n in range(1,count+1):
                data=z.read(first_image(z,n))
                im=Image.open(io.BytesIO(data)).convert('RGB')
                if im.size != (WIDTH, HEIGHT):
                  im=im.resize((WIDTH,HEIGHT),Image.Resampling.LANCZOS)
                out=slides/f'slide-{n:02d}.webp'
                im.save(out,'WEBP',quality=95,method=6)
            manifest_path=root/'manifest.json'
            manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
            manifest['slideFormat']='webp'
            manifest['imageWidth']=WIDTH
            manifest['imageHeight']=HEIGHT
            manifest['quality']='high-resolution 2560x1440 WebP quality 95'
            manifest['slideBasePath']=f'/9618/presentations/chapter-{chapter}/slides'
            for slide in manifest['slides']:
              slide['image']=f"/9618/presentations/chapter-{chapter}/slides/slide-{slide['number']:02d}.webp"
              slide['width']=WIDTH
              slide['height']=HEIGHT
            manifest['runtime']['projectDelivery']='high-resolution static slide images + PPTX mirror'
            manifest['runtime']['largeDisplayQuality']='2560x1440 WebP slides preserve clarity on projectors and large screens'
            manifest_path.write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
            print(chapter, count, 'webp slides written to', slides)
          PY
      - name: Commit high-resolution assets and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend/public/9618/presentations/chapter-03 frontend/public/9618/presentations/chapter-04 frontend/public/9618/presentations/chapter-05
          git rm .github/workflows/materialize-high-res-real-decks.yml
          git commit -m "Replace real deck slide assets with high-resolution WebP"
          git push origin HEAD:feature/high-res-real-deck-slides-20260921
