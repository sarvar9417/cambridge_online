name: 9618 mark scheme point source repair

on:
  push:
    branches: [main]
    paths:
      - '.9618-ms-source-point-repair-run'

permissions:
  contents: read
  id-token: write

jobs:
  source-point-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MS_SOURCE_AUDIT_RUNNER_URL: https://mphmganorvhsnwvhcxyj.supabase.co/functions/v1/ms-source-audit-runner
      SOURCE_POINT_REPAIR_REPORT: ms-source-point-repair-report.json
      SOURCE_POINT_REPAIR_STRICT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve repair mode from explicit marker
        run: |
          test -f .9618-ms-source-point-repair-run
          MODE="$(sed -n 's/^mode=//p' .9618-ms-source-point-repair-run | head -n1 | tr -d '\r')"
          case "$MODE" in
            plan)
              echo 'SOURCE_POINT_REPAIR_APPLY=NO' >> "$GITHUB_ENV"
              ;;
            apply)
              echo 'SOURCE_POINT_REPAIR_APPLY=YES' >> "$GITHUB_ENV"
              ;;
            *)
              echo "Invalid repair marker mode: $MODE" >&2
              exit 1
              ;;
          esac
          echo "REPAIR_MODE=$MODE" >> "$GITHUB_ENV"
      - name: Install PDF text tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Unit test source point repair gates
        run: python3 -m unittest scripts.test_ms_source_point_repair_v1
      - name: Plan or apply exact-source point repairs
        run: python3 backend/scripts/ms-source-point-repair-v1.py
      - name: Publish repair summary
        if: always()
        run: |
          if [ -f "$SOURCE_POINT_REPAIR_REPORT" ]; then
            python3 - <<'PY'
          import json, os
          report=json.load(open(os.environ['SOURCE_POINT_REPAIR_REPORT'],encoding='utf-8'))
          keys=('mode','sourceCount','targetCount','consideredPointMismatches','plannedRepairs','plannedSchemes','plannedSources','applied','replayed')
          summary={k:report.get(k) for k in keys}
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('## 9618 historical MS point source repair\n\n')
              for key,value in summary.items(): out.write(f'- **{key}**: {value}\n')
              out.write(f"- **sourceFailures**: {len(report.get('sourceFailures') or [])}\n")
          PY
          fi
      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms-source-point-repair-report
          path: ms-source-point-repair-report.json
          if-no-files-found: error
          retention-days: 30
