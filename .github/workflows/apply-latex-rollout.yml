name: Finalize LaTeX Question Bank surfaces

on:
  push:
    branches:
      - feat/latex-corpus-rollout

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/latex-corpus-rollout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Render LaTeX contexts, previews and compiled SVG assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('frontend/src/QuestionBankPage.tsx')
          text = page.read_text()

          import_anchor = "import { LatexQuestionText } from './lib/latex-question-text';\n"
          asset_import = "import { portableAssetUrl } from './lib/portable-source-assets';\n"
          if asset_import not in text:
              if import_anchor not in text:
                  raise SystemExit('LatexQuestionText import missing')
              text = text.replace(import_anchor, import_anchor + asset_import)

          old_asset = "  storagePath: string | null;\n  contentMd: string | null;"
          new_asset = "  storagePath: string | null;\n  url?: string | null;\n  contentMd: string | null;"
          if old_asset in text:
              text = text.replace(old_asset, new_asset, 1)

          replacement = r'''function QuestionAsset({ asset }: { asset: PortableAsset }) {
  const url = portableAssetUrl(asset);
  return <div className="qb-asset"><strong>{asset.kind}</strong><span>{asset.altText || 'Savol asseti'}{asset.sourcePage ? ` · source page ${asset.sourcePage}` : ''}</span>{url ? <img src={url} alt={asset.altText || 'Cambridge source asset'} loading="lazy" /> : asset.contentMd ? <pre>{asset.contentMd}</pre> : asset.storagePath ? <small>Private storage asset: {asset.storagePath.split('/').pop()}</small> : <small>Asset content missing</small>}</div>;
}

function ContextBlocks({ portable }: { portable: PortableQuestion }) {
  if (!portable.contextBlocks.length) return <div className="qb-no-context">Alohida shared context talab qilinmaydi.</div>;
  return <div className="qb-context-list">{portable.contextBlocks.map((block) => <section key={block.id}><div className="qb-context-head"><strong>{block.displayRef}</strong><span>Context</span></div>{(block.contextLatex || block.context) && <LatexQuestionText latex={block.contextLatex} fallback={block.context ?? ''} />}{block.assets.map((asset) => <QuestionAsset asset={asset} key={asset.id} />)}</section>)}</div>;
}

function PortableModal'''
          pattern = re.compile(r"function ContextBlocks\(\{ portable \}: \{ portable: PortableQuestion \}\) \{[\s\S]*?\n\}\n\nfunction PortableModal")
          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
          elif 'function QuestionAsset' not in text:
              raise SystemExit('ContextBlocks patch anchor missing')

          replacements = {
              '<p>{item.portable.leaf.stem}</p>': '<LatexQuestionText latex={item.portable.leaf.bodyFormat === \'latex\' ? item.portable.leaf.stemLatex : null} fallback={item.portable.leaf.stem} />',
              '<p>{portable.leaf.stem}</p>': '<LatexQuestionText latex={portable.leaf.bodyFormat === \'latex\' ? portable.leaf.stemLatex : null} fallback={portable.leaf.stem} />',
              '<p className="qb-review-stem">{item.portable.leaf.stem}</p>': '<LatexQuestionText className="qb-review-stem" latex={item.portable.leaf.bodyFormat === \'latex\' ? item.portable.leaf.stemLatex : null} fallback={item.portable.leaf.stem} />',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          page.write_text(text)

          css = Path('frontend/src/question-bank.css')
          css_text = css.read_text()
          marker = '/* latex-question-bank-rendering */'
          if marker not in css_text:
              css_text += '''\n/* latex-question-bank-rendering */\n.qb-question-main>.latex-question-text,.qb-family-parts .latex-question-text{font-size:13px;line-height:1.55;color:var(--qb-text)}.qb-question-main>.latex-question-text p,.qb-family-parts .latex-question-text p{margin:0;white-space:pre-wrap}.qb-basket-item>.latex-question-text{font-size:11px;line-height:1.4;margin:7px 0;max-height:4.7em;overflow:hidden}.qb-basket-item>.latex-question-text p{margin:0}.qb-context-list .latex-question-text{font-size:12px;line-height:1.5}.qb-context-list .latex-question-text p{margin:0;white-space:pre-wrap}.qb-leaf-preview>.latex-question-text{font-size:13px;line-height:1.55;margin-top:8px}.qb-leaf-preview>.latex-question-text p{margin:0;white-space:pre-wrap}.qb-review-stem{font-size:13px;line-height:1.55}.qb-review-stem p{margin:0;white-space:pre-wrap}.qb-asset img{display:block;max-width:100%;height:auto;margin-top:6px;background:#fff;border:1px solid var(--qb-border);border-radius:6px;padding:6px}.latex-question-math-display{display:block;overflow-x:auto;overflow-y:hidden;padding:.15em 0}.latex-question-math-error{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--qb-danger)}\n'''
              css.write_text(css_text)
          PY
      - name: Verify branch
        run: |
          npm ci
          npm run verify
      - name: Commit final rendered surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/QuestionBankPage.tsx frontend/src/question-bank.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(latex): render Question Bank latex and svg surfaces"
          git push origin HEAD:feat/latex-corpus-rollout
