name: Finalize LaTeX Question Bank surfaces

on:
  push:
    branches:
      - feat/latex-corpus-rollout

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/latex-corpus-rollout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch remaining rendered surfaces
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/finalize.py
          python /tmp/finalize.py
      - name: Verify branch
        run: |
          npm ci
          npm run verify
      - name: Commit final rendered surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/QuestionBankPage.tsx frontend/src/question-bank.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(latex): render Question Bank latex and svg surfaces"
          git push origin HEAD:feat/latex-corpus-rollout
