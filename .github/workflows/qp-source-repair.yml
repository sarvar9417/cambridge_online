name: Safe 9618 QP source repair

on:
  workflow_dispatch:
    inputs:
      only:
        description: Optional paper key, e.g. 2024-MJ-13
        required: false
        type: string
  push:
    branches: [fix/question-source-text-references]
    paths:
      - backend/scripts/qp-source-repair.py
      - backend/scripts/qp-source-repair-runner.py
      - .github/workflows/qp-source-repair.yml

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CORPUS_RUNNER_URL: https://mphmganorvhsnwvhcxyj.supabase.co/functions/v1/qp-source-repair-runner
      SOURCE_REPAIR_ONLY: ${{ inputs.only || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install layout extraction dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Parse official QPs and apply source-faithful repairs
        run: python backend/scripts/qp-source-repair-runner.py
