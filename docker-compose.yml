name: campath

# Supabase supplies PostgreSQL and Storage, so neither runs here by default.
# Redis has no Supabase equivalent and BullMQ needs it, so it stays local.
#
#   docker compose up                  api + worker + web + redis, against Supabase
#   docker compose --profile local up   also runs a local PostgreSQL and MinIO
#
# The `local` profile exists for offline work; point DATABASE_URL at it by hand.

services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    profiles: ['local']
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campath
      POSTGRES_PASSWORD: campath
      POSTGRES_DB: campath
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campath -d campath']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    profiles: ['local']
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: campath
      MINIO_ROOT_PASSWORD: campath-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio-data:/data']

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      # Supabase transaction pooler (port 6543) for request traffic.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the Supabase pooler URI}
      REDIS_URL: redis://redis:6379
      # Supabase Storage speaks S3: https://<ref>.supabase.co/storage/v1/s3
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-campath}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to at least 32 characters}
      WEB_ORIGIN: http://localhost:5173
    ports: ['3001:3001']
    depends_on:
      redis: { condition: service_healthy }
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./prompts:/app/prompts
      - /app/node_modules

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the Supabase pooler URI}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-campath}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # R9: the model key lives in this process and nowhere else.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      redis: { condition: service_healthy }
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./prompts:/app/prompts
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
    ports: ['5173:5173']
    depends_on: [api]
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - /app/node_modules

volumes:
  postgres-data:
  redis-data:
  minio-data:
